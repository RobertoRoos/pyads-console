[project]
name = "pyads-console"
version = "0.1.0"
description = "Ultra basic console app with an ADS connection"
readme = "README.md"
authors = [
    { name = "Robert Roos", email = "robert.soor@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pyads>=3.5.0",
    "pyqtconsole>=1.2.0",
    "pyside6>=6.10.0",
]

[project.scripts]
pyads-console = "pyads_console.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
